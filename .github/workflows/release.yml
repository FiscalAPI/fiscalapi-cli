name: Release

# Compila fiscalapi con Native AOT para cada RID en un runner de su SO (AOT no compila entre sistemas operativos) y deja
# un release EN BORRADOR con los empaques y SHA256SUMS. Publicarlo lo decide una persona (U-03).
on:
  push:
    tags:
      - "v*"
  # Prueba del pipeline sin crear un tag: el borrador queda como prerelease si la versión lleva "-".
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica sin la v (p. ej. 0.1.0-rc.1). El borrador se crea con el tag v<versión> sobre el commit elegido."
        required: true
        type: string

permissions:
  contents: read      # Required for actions/checkout; solo el job release escribe.

# Las corridas del mismo tag o rama van de una en una: la que llega queda pendiente hasta que termine la que está en curso,
# que nunca se cancela. Si llega otra mientras una espera, GitHub cancela la pendiente y deja la más nueva.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # La versión sale del tag (v1.2.3 → 1.2.3) o de la entrada del workflow_dispatch, y se valida como semver 2.0.0
      # antes de compilar: es -p:Version, el --version del binario y lo que compara el aviso de versión nueva.
      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          # El valor sin validar no se imprime: podría traer texto que el runner interprete como comando (::…::).
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${identifier}(\.${identifier})*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::La versión del tag o de la entrada 'version' no es semántica (p. ej. v1.2.3 o 1.2.3-rc.1)."
            exit 1
          fi
          # workflow_dispatch sobre un tag: la versión del binario debe ser la del tag.
          if [ "$REF_TYPE" = "tag" ] && [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::La entrada 'version' no coincide con el tag v$version; déjala igual a $version o corre sobre una rama."
            exit 1
          fi
          without_build="${version%%+*}"
          if [[ "$without_build" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $version (prerelease: $prerelease)."

      # En workflow_dispatch el borrador apunta a este commit con --target, pero GitHub ignora target_commitish si el tag
      # ya existe: el release quedaría con binarios de otro commit. Por eso un tag existente detiene la corrida.
      - name: Ensure the tag does not exist yet
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}   # contents: read del workflow.
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if output=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .ref 2>&1); then
            echo "::error::El tag $TAG ya existe. Usa otra versión o empuja el tag para un release real."
            exit 1
          fi
          if [[ "$output" != *"HTTP 404"* ]]; then
            echo "::error::No se pudo comprobar si el tag $TAG existe: $output"
            exit 1
          fi
          echo "El tag $TAG no existe: el borrador lo creará sobre $GITHUB_SHA al publicarse."

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            binary: fiscalapi.exe
            package: fiscalapi-win-x64.zip
          # El runner solo aloja Docker: el binario se enlaza en AlmaLinux 8 (glibc 2.28), ver publish-linux.sh.
          - rid: linux-x64
            os: ubuntu-latest
            binary: fiscalapi
            package: fiscalapi-linux-x64.tar.gz
          - rid: osx-arm64
            os: macos-latest
            binary: fiscalapi
            package: fiscalapi-osx-arm64.tar.gz
          # Runner Intel propio: el humo de --version corre nativo, sin depender de Rosetta en el runner arm64.
          - rid: osx-x64
            os: macos-26-intel
            binary: fiscalapi
            package: fiscalapi-osx-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
      PUBLISH_DIR: artifacts/${{ matrix.rid }}
      BINARY: ${{ matrix.binary }}
      PACKAGE: ${{ matrix.package }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # AlmaLinux 8.10 fijada por digest (docker inspect almalinux:8, 2026-10-13); se actualiza a propósito, no sola.
      LINUX_BUILD_IMAGE: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Sin el token en .git/config: ningún paso posterior lo necesita y así no queda al alcance de otro proceso.
          persist-credentials: false

      # En Linux el SDK se instala dentro del contenedor de compilación.
      - name: Set up .NET
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Con VS 18 (2026) e ILCompiler 10.0.12, vcvarsall.bat llama a vswhere.exe sin ruta y el link falla (MSB3073) si su
      # carpeta no está en PATH. windows-latest trae hoy VS 2022 17.14 con "Desktop development with C++"; agregarla
      # no cambia nada ahí y protege la compilación cuando el runner pase a VS 2026.
      - name: Add the Visual Studio Installer folder to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Get-Command vswhere.exe -ErrorAction SilentlyContinue
          Write-Host "vswhere.exe antes del cambio: $(if ($vswhere) { $vswhere.Source } else { 'no está en PATH' })"
          Add-Content -Path $env:GITHUB_PATH -Value $installer

      # Ida y vuelta real en el almacén del SO (CLI-002): Credential Manager en Windows y el llavero en macOS, que el CI de
      # los PR (Linux) no cubre. El release no sigue si falla, y se exige que todas hayan corrido y pasado (ninguna omitida).
      # En macOS corre con un llavero de prueba desbloqueado como llavero por omisión.
      - name: Credential store tests (Credential Manager / Keychain)
        if: runner.os != 'Linux'
        run: |
          test_command=(dotnet test FiscalApi.Cli.slnx -c Release
            --filter "FullyQualifiedName~CredentialStoreTests"
            --logger "trx;LogFileName=credential-store.trx" --results-directory TestResults)
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash .github/scripts/with-test-keychain.sh "${test_command[@]}"
          else
            "${test_command[@]}"
          fi
          counters=$(grep -o '<Counters [^>]*>' TestResults/credential-store.trx)
          total=$(sed -E 's/.* total="([0-9]+)".*/\1/' <<< "$counters")
          passed=$(sed -E 's/.* passed="([0-9]+)".*/\1/' <<< "$counters")
          echo "CredentialStoreTests: $passed de $total pasaron."
          if [ "$total" -eq 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::CredentialStoreTests debe correr y pasar completa en $RID ($passed de $total)."
            exit 1
          fi

      # TreatWarningsAsErrors (Directory.Build.props) convierte cualquier advertencia IL de trimming/AOT en un error.
      - name: Publish Native AOT (${{ matrix.rid }})
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$LINUX_BUILD_IMAGE" \
              bash .github/scripts/publish-linux.sh "$VERSION" "$PUBLISH_DIR"
          else
            dotnet publish src/FiscalApi.Cli -c Release -r "$RID" -p:Version="$VERSION" -o "$PUBLISH_DIR"
          fi

      # El binario de cada RID responde en su SO. CI=true (lo define Actions) apaga el aviso de versión nueva.
      - name: Smoke test
        run: |
          actual=$("./$PUBLISH_DIR/$BINARY" --version | tr -d '\r')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::$BINARY --version devolvió '$actual' en $RID; se esperaba '$VERSION'."
            exit 1
          fi
          "./$PUBLISH_DIR/$BINARY" --help > /dev/null
          echo "$RID: fiscalapi $actual"

      # Solo el binario: los símbolos (.pdb, .dbg, .dSYM) se quedan fuera, y cada empaque debe traer exactamente una
      # entrada, el binario.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR/$env:BINARY" -DestinationPath "dist/$env:PACKAGE"
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/$env:PACKAGE"))
          try { $entries = @($zip.Entries | ForEach-Object FullName) } finally { $zip.Dispose() }
          if ($entries.Count -ne 1 -or $entries[0] -ne $env:BINARY) {
            Write-Output "::error::$env:PACKAGE debe traer solo $env:BINARY; trae: $($entries -join ', ')."
            exit 1
          }

      # COPYFILE_DISABLE: el tar de macOS no agrega los archivos ._* de atributos extendidos.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/$PACKAGE" -C "$PUBLISH_DIR" "$BINARY"
          tar -tzvf "dist/$PACKAGE"
          entries=$(tar -tzf "dist/$PACKAGE")
          if [ "$entries" != "$BINARY" ]; then
            echo "::error::$PACKAGE debe traer solo $BINARY; trae: $(tr '\n' ' ' <<< "$entries")."
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.rid }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7
          # Ya va comprimido.
          compression-level: 0

  release:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # Crear el release borrador y subir sus archivos.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      # Exactamente los 4 empaques de D-24 y su SHA256SUMS, verificado antes de subirlo.
      - name: Checksums
        working-directory: dist
        run: |
          expected=(fiscalapi-win-x64.zip fiscalapi-linux-x64.tar.gz fiscalapi-osx-arm64.tar.gz fiscalapi-osx-x64.tar.gz)
          for package in "${expected[@]}"; do
            if [ ! -f "$package" ]; then
              echo "::error::Falta $package."
              exit 1
            fi
          done
          if [ "$(find . -maxdepth 1 -type f | wc -l)" -ne "${#expected[@]}" ]; then
            echo "::error::dist trae archivos de más: $(ls)."
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # Un tag empujado ya existe (--verify-tag). En workflow_dispatch el tag se crea sobre este commit hasta que alguien
      # publique el borrador. --generate-notes arma las notas desde los PR; se editan antes de publicar.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          args=(--draft --title "fiscalapi $VERSION" --generate-notes)
          if [ "$REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/fiscalapi-* dist/SHA256SUMS
          gh release view "$TAG" --json isDraft,isPrerelease,assets --jq '{isDraft, isPrerelease, assets: [.assets[].name]}'
